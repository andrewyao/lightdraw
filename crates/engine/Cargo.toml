[package]
name = "engine"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# wgpu 30 is the version glyphon 0.12 (its newest release) builds against.
# Bump both together.
[dependencies]
doc = { path = "../doc" }
wgpu = { version = "30", features = ["webgl"] }
glyphon = "0.12"
glam = "0.34"
rstar = "0.12"
bytemuck = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.18"
pollster = "0.4"

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8"
doc = { path = "../doc", features = ["ron"] }

[[bench]]
name = "frame"
harness = false
