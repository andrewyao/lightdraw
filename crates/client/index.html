<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lightdraw</title>
    <link data-trunk rel="rust" data-bin="client" data-wasm-opt="0" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #9ef; font: 13px system-ui, sans-serif; }
      .app { position: fixed; inset: 0; }
      .stage { display: block; width: 100%; height: 100%; touch-action: none; }
      .overlay { position: absolute; inset: 0; pointer-events: none; }
      button { background: rgba(10, 40, 55, 0.85); color: #9ef; border: 1px solid rgba(120, 220, 255, 0.35); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
      button:hover { border-color: rgba(160, 240, 255, 0.8); }
      button.on { background: rgba(40, 160, 200, 0.45); color: #fff; border-color: #7ff; }
      button:disabled { opacity: 0.4; cursor: default; }
      .toolbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
      .toolbar .sep { width: 10px; }
      .toolbar kbd { margin-left: 6px; font: inherit; font-size: 0.8em; opacity: 0.55; }
      .room { position: absolute; left: 12px; bottom: 10px; background: rgba(0, 20, 30, 0.6); padding: 6px 10px; border-radius: 4px; }
      .peers { list-style: none; margin: 4px 0 0; padding: 0; }
      .panel { position: absolute; top: 52px; max-height: calc(100% - 72px); overflow-y: auto; background: rgba(0, 18, 26, 0.88); border: 1px solid rgba(120, 220, 255, 0.25); border-radius: 6px; padding: 8px 12px; width: 260px; }
      .panel h3 { margin: 0 0 8px; font-size: 14px; }
      .panel h4 { margin: 10px 0 4px; font-size: 12px; opacity: 0.7; }
      .library { left: 12px; }
      .library ul { list-style: none; margin: 0; padding: 0; }
      .library li { padding: 4px 6px; border-radius: 3px; cursor: grab; }
      .library li:hover { background: rgba(40, 160, 200, 0.3); }
      .lab { right: 12px; }
      .style { right: 12px; top: auto; bottom: 12px; width: 230px; }
      .swatches { font-size: 11px; margin: 6px 0; }
      .swatches .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .swatches .swatch { width: 16px; height: 16px; padding: 0; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.25); cursor: pointer; }
      .swatches .swatch.on { outline: 2px solid #7fd8ff; outline-offset: 1px; }
      .lab .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      .slider { display: grid; grid-template-columns: 1fr 90px 44px; align-items: center; gap: 6px; font-size: 11px; }
      .slider input { width: 90px; }
      .slider output { text-align: right; font-variant-numeric: tabular-nums; }
      .text-edit { position: absolute; box-sizing: border-box; background: rgba(0, 30, 40, 0.8); color: #dff; border: 1px solid #7ff; font: 14px system-ui, sans-serif; resize: none; outline: none; padding: 4px; }
    </style>
  </head>
  <body></body>
</html>
